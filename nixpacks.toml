[providers]
providers = ["php", "node"]

[phases.setup]
nixPkgs = [
    "php82",
    "php82Packages.composer",
    "nodejs-20_x",
    "php82Extensions.pdo",
    "php82Extensions.pdo_pgsql",
    "php82Extensions.pgsql",
    "php82Extensions.gd",
    "php82Extensions.mbstring",
    "php82Extensions.bcmath",
    "php82Extensions.zip"
]

[phases.build]
cmds = [
    "npm install",
    "npm run build",
    "composer install --no-dev --optimize-autoloader"
]

[phases.deploy]
cmd = "php artisan storage:link || true && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
